<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>The Witching Wheel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one centered column — sealed title, riddle scroll, the ritual circle as the hero, ring controls, then the revealed coordinates. Single dark "witch's floor" look by choice. */
:root{
  --night:#0f0d1a;   /* page */
  --stone:#2c2840;   /* ring stone */
  --stone2:#3b3454;  /* ring highlight, panels */
  --carve:#b9acd9;   /* carved runes */
  --gold:#ffcf6e;    /* pointer, solved glow */
  --ember:#ff9f43;   /* accents */
  --bone:#ece6f6;    /* text */
  --ash:#9a90b5;     /* muted text */
  --display:"Cinzel Decorative","Trajan Pro",Georgia,serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--bone)}
body{font-family:var(--body);font-size:16px;line-height:1.55;padding-block:24px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(ellipse at 50% 30%,rgba(90,70,150,.25),transparent 60%)}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:20px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,6vw,2.6rem);line-height:1.1;margin:0;text-align:center;color:var(--gold);
  text-shadow:0 0 18px rgba(255,207,110,.35);text-wrap:balance;letter-spacing:.02em}
.sub{color:var(--ash);margin:-8px 0 0;text-align:center}
.scroll{background:linear-gradient(180deg,#e9dcc0,#d8c6a0);color:#3a2a14;border-radius:6px;padding:16px 22px;max-width:48ch;width:100%;box-sizing:border-box;
  box-shadow:0 6px 24px rgba(0,0,0,.45);font-style:italic;text-align:center}
.scroll p{margin:0}
.scroll .lead{font-style:normal;font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#7a5a2a;margin-bottom:8px}
.stage{position:relative;width:min(100%,560px);aspect-ratio:1;max-width:100%}
#circle{width:100%;height:100%;display:block;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.ring{transform-box:view-box;transform-origin:300px 300px;transition:transform .55s cubic-bezier(.3,1.35,.5,1)}
.band{fill:none;stroke:var(--stone);cursor:pointer}
.band:hover{stroke:var(--stone2)}
.edge{fill:none;stroke:#5a5078;stroke-width:1.5}
.rune{color:var(--carve);transition:color .6s}
.rune use{pointer-events:none}
.tick{stroke:#4a4266;stroke-width:2}
.solved .rune.top{color:var(--gold);filter:url(#glow)}
.solved .band{stroke:#3a3150}
.beam{fill:var(--gold);opacity:.07;pointer-events:none}
.solved .beam{opacity:.22;transition:opacity 1.5s}
.core-sigil{fill:none;stroke:#6b5f95;stroke-width:2}
.solved .core-sigil{stroke:var(--gold);filter:url(#glow);transition:stroke 1s}
.flare{position:absolute;inset:0;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(255,230,160,.85) 0%,rgba(255,170,60,.35) 30%,transparent 62%)}
.stage.solved .flare{animation:flare 1.8s ease-out}
@keyframes flare{0%{opacity:0;transform:scale(.2)}25%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
.puff{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(255,226,170,.55),rgba(255,190,110,.18) 45%,transparent 70%);filter:blur(4px)}
@keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:.85}100%{opacity:0;transform:translate(var(--dx),-280px) scale(2.6)}}
.controls{display:grid;grid-template-columns:repeat(3,auto);gap:10px 14px;justify-content:center;align-items:center}
.ctl{display:flex;align-items:center;gap:6px}
.ctl span{font-size:14px;color:var(--ash);min-width:4.2em;text-align:center}
button{font:inherit;font-size:15px;color:var(--bone);background:var(--stone);border:1px solid #5a5078;border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button[aria-pressed="true"]{background:var(--gold);color:var(--night);border-color:var(--gold);font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
#turns{color:var(--ash);font-variant-numeric:tabular-nums;font-size:14px}
.hint{color:var(--ash);font-size:14px;margin:0;text-align:center;max-width:52ch}
#coords{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,5.5vw,2.3rem);line-height:1.25;text-align:center;color:var(--gold);margin:0;
  text-shadow:0 0 16px rgba(255,207,110,.6);font-variant-numeric:tabular-nums;min-height:2.6em}
#coords.show{animation:condense 2.4s ease-out 1.1s both}
#coords small{display:block;font-family:var(--body);font-weight:400;font-size:15px;color:var(--ash);text-shadow:none}
@keyframes condense{0%{opacity:0;filter:blur(14px);transform:translateY(30px) scale(1.1)}60%{opacity:.8;filter:blur(3px)}100%{opacity:1;filter:none;transform:none}}
@media (max-width:440px){.controls{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.ring{transition:none}.stage.solved .flare{animation:none}#coords.show{animation:none}.puff{display:none}}
</style>
<style>
.levelbar{display:flex;align-items:center;gap:12px;color:var(--ash);font-size:14px;letter-spacing:.1em;text-transform:uppercase}
.pips{display:flex;gap:8px}
.pip{width:14px;height:14px;border-radius:50%;border:2px solid #5a5078;box-sizing:border-box}
.pip.now{border-color:var(--gold)}
.pip.done{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px rgba(255,207,110,.7)}
.scroll h2{font-family:var(--display);font-style:normal;font-size:1.25rem;margin:0;color:#5a3d14;text-wrap:balance}
#stagemsg{font-family:var(--display);font-weight:700;color:var(--gold);font-size:clamp(1.15rem,4.5vw,1.5rem);text-align:center;margin:0;min-height:1.4em;text-shadow:0 0 12px rgba(255,207,110,.45)}
#music{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);right:max(12px,calc(env(safe-area-inset-right,0px) + 12px));z-index:20;font-size:13px;padding:6px 10px;background:rgba(44,40,64,.85)}
#next{background:var(--gold);color:var(--night);border-color:var(--gold);font-weight:700;font-size:16px;padding:9px 18px}
.bandfill{fill:var(--stone);transition:fill .25s;cursor:pointer}
.ring:nth-of-type(even) .bandfill{fill:#332e4a}
.ring.jolt .bandfill{fill:#4b4170}
.notch{stroke:#5a5078;stroke-width:2}
.sig{fill:none;stroke:var(--carve);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;transition:stroke .5s;pointer-events:none}
.ring.lit .sig,.sig.core{stroke:var(--gold);filter:url(#glow)}
.solved .sig{stroke:#ffe39a}
.controls.four{grid-template-columns:repeat(2,auto)}
@media (max-width:440px){.controls.four{grid-template-columns:1fr}}
</style>

<div class="wrap">

  <div class="scroll">

  <div class="stage" id="stage">
    <svg id="circle" viewBox="0 0 600 600" role="img" aria-label="A ritual circle of rotating stone rings with a broken sigil carved across them"></svg>
    <div class="flare"></div>
  </div>

  <p id="stagemsg" role="status"></p>
  <button id="next" hidden>Next circle →</button>
  <div class="bar">
    <button id="music" aria-pressed="false">♪ Music: off</button>
  </div>
  <p id="coords"></p>
</div>

 "Turn the rings until the broken sigil is whole again. A ring lights up when its lines join the glowing heart, so work from the center outward.",

const SAVE="chester-sigil-v1";
const cyrb53=(str,seed=0)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);};
const mod=(a,n)=>((a%n)+n)%n;

const LV=()=>DATA.levels[level];
let level=0, rot=[], turns=0, sealed=false, finished=false, done=[];

function litCount(r){
  const L=LV(),acc=[];let c=0;
  for(let k=L.n-1;k>=0;k--){acc.push(mod(r[k],12));if(cyrb53(`sigil-L${level+1}:`+acc.join(','),100+level*10+k)===L.chain[L.n-1-k])c++;else break;}
  return c;
}
function scramble(){const n=LV().n;let r;do{r=Array.from({length:n},()=>Math.floor(Math.random()*12));}while(litCount(r)>0);return r;}

try{const s=JSON.parse(localStorage.getItem(SAVE));
  if(s&&Number.isInteger(s.level)&&s.level>=0&&s.level<3&&Array.isArray(s.rot)&&s.rot.length===DATA.levels[s.level].n){level=s.level;rot=s.rot;turns=s.turns|0;done=Array.isArray(s.done)?s.done.slice(0,level):[];}
}catch(e){}
if(!rot.length)rot=scramble();

const svg=document.getElementById('circle'),stage=document.getElementById('stage'),nextBtn=document.getElementById('next'),msg=document.getElementById('stagemsg'),coords=document.getElementById('coords');
const el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;};
const annulus=(R,r)=>`M300 ${300-R} A${R} ${R} 0 1 1 299.99 ${300-R} Z M300 ${300-r} A${r} ${r} 0 1 1 299.99 ${300-r} Z`;

function build(){
  const L=LV(),E=EDGES[L.n];
  svg.innerHTML=`<defs><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="floor"><stop offset="0" stop-color="#241f38"/><stop offset="1" stop-color="#15121f"/></radialGradient>
  <radialGradient id="corelight"><stop offset="0" stop-color="#4f4380"/><stop offset="1" stop-color="#211b33"/></radialGradient>
  ${L.rings.map((_,k)=>`<clipPath id="clip${k}"><path clip-rule="evenodd" d="${annulus(E[k]-2,E[k+1]+2)}"/></clipPath>`).join('')}
  <clipPath id="clipcore"><circle cx="300" cy="300" r="${E[L.n]-2}"/></clipPath></defs>`;
  el('circle',{cx:300,cy:300,r:294,fill:'url(#floor)',stroke:'#4a4266','stroke-width':2},svg);
  el('circle',{cx:300,cy:300,r:287,fill:'none',stroke:'#3a3352','stroke-width':1,'stroke-dasharray':'2 6'},svg);
  L.rings.forEach((d,k)=>{
    const g=el('g',{class:'ring',id:'ring'+k},svg);
    el('path',{class:'bandfill','fill-rule':'evenodd',d:annulus(E[k],E[k+1])},g);
    for(let i=0;i<12;i++){const a=i*30*Math.PI/180;el('line',{class:'notch',x1:300+(E[k]-1)*Math.sin(a),y1:300-(E[k]-1)*Math.cos(a),x2:300+(E[k]-7)*Math.sin(a),y2:300-(E[k]-7)*Math.cos(a)},g);}
    el('path',{class:'sig',d,'clip-path':`url(#clip${k})`},g);
    el('circle',{cx:300,cy:300,r:E[k+1],fill:'none',stroke:'#14111d','stroke-width':3},g);
  });
  el('circle',{cx:300,cy:300,r:E[L.n],fill:'url(#corelight)'},svg);
  el('path',{class:'sig core',d:L.core,'clip-path':'url(#clipcore)'},svg);
  document.getElementById('sealname').textContent=L.name;
  document.getElementById('levelname').textContent=`Circle ${level+1} of 3`;
  updatePips();
}
function updatePips(){const p=document.getElementById('pips');p.innerHTML='';for(let i=0;i<3;i++){const s=document.createElement('span');s.className='pip'+(i<level||(i===level&&(sealed||finished))?' done':i===level?' now':'');p.appendChild(s);}}
function render(){
  const n=LV().n,c=litCount(rot);
  rot.forEach((r,k)=>{const g=document.getElementById('ring'+k);g.style.transform=`rotate(${r*30}deg)`;g.classList.toggle('lit',k>=n-c);});
  return c===n;
}
function save(){try{localStorage.setItem(SAVE,JSON.stringify({level,rot,turns,done}));}catch(e){}}
function setControls(on){document.querySelectorAll('#controls button').forEach(b=>b.disabled=!on);}

function turn(k,dir){
  if(sealed||finished)return;
  const mv=LV().moves[k];
  mv.forEach((v,j)=>{rot[j]+=dir*v;if(j!==k&&v){const g=document.getElementById('ring'+j);g.classList.remove('jolt');void g.getBBox();g.classList.add('jolt');setTimeout(()=>g.classList.remove('jolt'),450);}});
  turns++;const whole=render();save();if(whole)complete(true);
}
function complete(user){
  done[level]=`L${level+1}:`+rot.map(r=>mod(r,12)).join(',');
  if(level<2){
    sealed=true;setControls(false);stage.classList.add('sealed');
    msg.textContent=level===0?'The first sigil is mended.':'The second sigil is mended.';nextBtn.hidden=false;updatePips();
    if(user)sealChime();
  } else finale(user);
  save();
}
nextBtn.onclick=()=>{level++;turns=0;sealed=false;rot=scramble();nextBtn.hidden=true;msg.textContent='';stage.classList.remove('sealed');build();render();save();setControls(true);};

svg.addEventListener('click',e=>{
  if(sealed||finished)return;
  const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
  const m=svg.getScreenCTM();if(!m)return;const q=pt.matrixTransform(m.inverse());
  const d=Math.hypot(q.x-300,q.y-300),E=EDGES[LV().n];
  const k=E.findIndex((R,i)=>i<E.length-1&&d<=R&&d>E[i+1]);
  if(k<0)return;
  turn(k,q.x>=300?1:-1);
});

let ac=null,master=null,timer=null,step=0;
const hz=n=>440*Math.pow(2,(n-69)/12);
function ensureAudio(){if(!ac){const A=window.AudioContext||window.webkitAudioContext;ac=new A();master=ac.createGain();master.gain.value=0;master.connect(ac.destination);}return ac;}
function tone(f,t,d,type,vol,dest){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(dest||master);o.start(t);o.stop(t+d+.05);}
const mel=[62,65,69,68,62,65,67,66,62,65,69,72,71,68,67,65];
function tick(){const t=ac.currentTime+.05;tone(hz(mel[step%mel.length]),t,1,'triangle',.2);if(step%8===0)tone(hz(38),t,3.8,'sine',.3);step++;}
const mb=document.getElementById('music');
function musicOff(){if(timer){clearInterval(timer);timer=null;master.gain.setTargetAtTime(0,ac.currentTime,.1);}mb.textContent='♪ Music: off';mb.setAttribute('aria-pressed','false');}
mb.onclick=async()=>{try{ensureAudio();if(timer){musicOff();}else{await ac.resume();master.gain.setTargetAtTime(.25,ac.currentTime,.1);tick();timer=setInterval(tick,480);mb.textContent='♪ Music: on';mb.setAttribute('aria-pressed','true');}}catch(e){mb.textContent='♪ Music unavailable';}};
function bell(f,t,vol,dest){[[1,1],[2.76,.45],[5.4,.2]].forEach(([m,a])=>tone(f*m,t,3.2/m+.4,'sine',vol*a,dest));}
function out(){const v=ac.createGain();v.gain.value=.32;v.connect(ac.destination);return v;}
function sealChime(){try{ensureAudio();ac.resume();const v=out(),t=ac.currentTime+.05;[71,76,79].forEach((n,i)=>bell(hz(n),t+i*.22,.28,v));}catch(e){}}
function finalChime(){try{ensureAudio();ac.resume();musicOff();const v=out(),t=ac.currentTime+.1;[76,71,79,74,83,88].forEach((n,i)=>bell(hz(n),t+i*.32,.3,v));tone(hz(40),t,3.8,'sine',.35,v);tone(hz(52),t+1.9,2.4,'triangle',.12,v);}catch(e){}}

function finale(user){
  finished=true;setControls(false);
  const all=done.slice(0,3).join('|');
  const text=DATA.lock.map((v,i)=>String.fromCharCode(v^(cyrb53(all,7000+i)&0xffff))).join('');
  coords.innerHTML=text.replace('  ','<br>');
  stage.classList.add('solved');msg.textContent='The spell is spoken!';updatePips();
  if(user){
    finalChime();
    for(let i=0;i<14;i++){const s=document.createElement('div');s.className='puff';s.style.setProperty('--dx',(Math.random()*160-80)+'px');
      s.style.animation=`rise ${2.6+Math.random()*1.4}s ease-out ${0.5+i*0.12}s forwards`;stage.appendChild(s);setTimeout(()=>s.remove(),6000);}
    coords.classList.remove('show');void coords.offsetWidth;coords.classList.add('show');
  }
}
build();if(render())complete(false);
</script>
